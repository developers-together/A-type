<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A-Type Tests</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: 'JetBrains Mono', monospace;
      background: #0a0a0a;
      color: #d1d0c5;
    }
    h1 {
      color: #e2b714;
    }
    #results {
      margin-top: 20px;
      padding: 20px;
      background: #2c2e31;
      border-radius: 4px;
      white-space: pre-wrap;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h1>A-Type Test Suite</h1>
  <div id="results">Running tests...</div>
  
  <script type="module">
    const resultsDiv = document.getElementById('results');
    
    if (window.location.protocol === 'file:') {
      resultsDiv.textContent = [
        '❌ This page must be served over HTTP, not opened as a file.',
        'Run from your local server and open:',
        'http://localhost:<port>/test-all.html',
      ].join('\n');
      throw new Error('test-all.html opened via file://');
    }

    const originalLog = console.log;
    const originalError = console.error;
    const originalWarn = console.warn;
    
    console.log = (...args) => {
      originalLog(...args);
      resultsDiv.textContent += args.join(' ') + '\n';
    };
    
    console.error = (...args) => {
      originalError(...args);
      resultsDiv.textContent += '❌ ' + args.join(' ') + '\n';
    };
    
    console.warn = (...args) => {
      originalWarn(...args);
      resultsDiv.textContent += '⚠️  ' + args.join(' ') + '\n';
    };

    async function main() {
      try {
        // Clear results
        resultsDiv.textContent = '';

        const { runTests } = await import('./js/tests/runner.js');
        const { signalTests } = await import('./js/tests/Signal.test.js');
        const { storeTests } = await import('./js/tests/Store.test.js');
        const { routerTests } = await import('./js/tests/Router.test.js');
        const { glyphCacheTests } = await import('./js/tests/GlyphCache.test.js');

        await runTests([signalTests, storeTests, routerTests, glyphCacheTests]);
      } catch (err) {
        console.error('Test runner bootstrap failed:', err?.message ?? String(err));
      }
    }

    await main();
  </script>
</body>
</html>
