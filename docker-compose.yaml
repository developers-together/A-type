services:
  mariadb:
    image: mariadb:10.6
    container_name: atype-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: atype
    command:
      - --local-infile=1
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ./db/atype.sql:/docker-entrypoint-initdb.d/01-atype.sql:ro
      - ./db/words.txt:/docker-entrypoint-initdb.d/words.txt:ro
      - ./db/mariadb.cnf:/etc/mysql/conf.d/99-atype.cnf:ro
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    stop_grace_period: 20s
    networks:
      - app-network

  php-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atype-php
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      DB_HOST: mariadb
      DB_USER: root
      DB_PASSWORD: rootpass
      DB_NAME: atype
    ports:
      - "80:80"
    volumes:
      - ./App:/var/www/html/App
      - ./Public:/var/www/html/Public
      - ./vhost.conf:/etc/apache2/sites-available/000-default.conf:ro
    stop_grace_period: 20s
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
